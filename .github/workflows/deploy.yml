name: Deploy to Firebase

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/955000045296/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: firebase-adminsdk-fbsvc@mrgnt-webpage.iam.gserviceaccount.com
          create_credentials_file: true
          export_environment_variables: true

      - name: Install functions dependencies
        run: npm ci
        working-directory: functions

      - name: Deploy to Firebase
        run: npx firebase-tools@14.21.0 deploy --only hosting:prod,functions:api,firestore,storage --project mrgnt-webpage --interactive
